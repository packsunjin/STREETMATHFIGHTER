name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smf_test
      CLOUDINARY_URL: cloudinary://key:secret@test-cloud
      SESSION_SECRET: ci-test-secret
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: testpass123

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 루트 의존성 설치
        run: npm ci

      - name: 백엔드 테스트 실행
        run: npm test

      - name: 관리자 통계 대시보드(React) 빌드 확인
        run: npm run build
