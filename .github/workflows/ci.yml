name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smf_test
      CLOUDINARY_URL: cloudinary://key:secret@test-cloud
      SESSION_SECRET: ci-test-secret
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: testpass123

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 루트 의존성 설치
        run: npm ci

      # 진행 화면(필기·카운트다운·타이머)은 실제 브라우저로 검증하므로 크로미움이 필요.
      # 없으면 해당 테스트는 자동으로 건너뛰지만, CI에서는 반드시 돌게 설치한다.
      - name: 테스트용 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 테스트 실행 (백엔드 + 브라우저)
        run: npm test

      - name: 관리자 통계 대시보드(React) 빌드 확인
        run: npm run build
