<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>스트릿매쓰파이터</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="home-wrap">
    <div class="home-hero">
      <div class="siren">🚨</div>
      <p class="brand-en">STREET MATH FIGHTER</p>
      <h1>스트릿매쓰파이터</h1>
    </div>
    <div class="difficulty-list">
      <div class="unit-select-wrap">
        <label for="unitSelect" class="unit-select-label">단원</label>
        <select id="unitSelect" class="unit-select">
          <option value="">전체 단원</option>
        </select>
      </div>
      <button class="difficulty-bar" data-difficulty="하">
        <span class="difficulty-bar-index">01</span>
        <span class="difficulty-bar-text">
          <span class="difficulty-bar-label">하</span>
          <span class="difficulty-bar-caption">쉬움</span>
        </span>
        <svg class="difficulty-bar-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button class="difficulty-bar" data-difficulty="중">
        <span class="difficulty-bar-index">02</span>
        <span class="difficulty-bar-text">
          <span class="difficulty-bar-label">중</span>
          <span class="difficulty-bar-caption">보통</span>
        </span>
        <svg class="difficulty-bar-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button class="difficulty-bar" data-difficulty="상">
        <span class="difficulty-bar-index">03</span>
        <span class="difficulty-bar-text">
          <span class="difficulty-bar-label">상</span>
          <span class="difficulty-bar-caption">어려움</span>
        </span>
        <svg class="difficulty-bar-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <script src="js/queue.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
