<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>스트릿매쓰파이터</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="home-wrap">
    <div class="home-inner">
      <header class="home-hero">
        <h1 class="home-title">스트릿<em>매쓰</em>파이터</h1>
        <p class="home-subtitle">
          <span id="greeting">난이도를 고르면 바로 한 판 시작</span>
          <button type="button" class="link-inline" id="nameBtn">이름 설정</button>
        </p>
      </header>

      <!-- 내 기록: 지금까지 푼 문제 / 정답률 / 연속 정답 -->
      <section class="my-stats" id="myStats" hidden>
        <div class="my-stats-row">
          <div class="my-stat">
            <span class="my-stat-value" id="statSolved">0</span>
            <span class="my-stat-label">푼 문제</span>
          </div>
          <div class="my-stat">
            <span class="my-stat-value" id="statAccuracy">0%</span>
            <span class="my-stat-label">정답률</span>
          </div>
          <div class="my-stat">
            <span class="my-stat-value" id="statStreak">0</span>
            <span class="my-stat-label">연속 정답</span>
          </div>
        </div>
        <a class="my-stats-link" id="reviewLink" href="review.html" hidden>
          <span id="reviewLinkText">오답 노트</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </a>
      </section>

      <div class="difficulty-list">
        <button class="difficulty-bar" data-difficulty="하" data-level="하">
          <span class="difficulty-bar-main">
            <span class="difficulty-bar-label">하</span>
            <span class="difficulty-bar-caption">쉬움</span>
          </span>
          <span class="difficulty-bar-meta">
            <span class="difficulty-bar-time">⏱ 1분 30초</span>
            <svg class="difficulty-bar-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </span>
        </button>
        <button class="difficulty-bar" data-difficulty="중" data-level="중">
          <span class="difficulty-bar-main">
            <span class="difficulty-bar-label">중</span>
            <span class="difficulty-bar-caption">보통</span>
          </span>
          <span class="difficulty-bar-meta">
            <span class="difficulty-bar-time">⏱ 3분</span>
            <svg class="difficulty-bar-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </span>
        </button>
        <button class="difficulty-bar" data-difficulty="상" data-level="상">
          <span class="difficulty-bar-main">
            <span class="difficulty-bar-label">상</span>
            <span class="difficulty-bar-caption">어려움</span>
          </span>
          <span class="difficulty-bar-meta">
            <span class="difficulty-bar-time">⏱ 5분</span>
            <svg class="difficulty-bar-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </span>
        </button>
      </div>
    </div>
  </div>

  <script src="vendor/anime.umd.min.js"></script>
  <script src="vendor/motion.min.js"></script>
  <script src="js/anim.js"></script>
  <script src="js/student.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
