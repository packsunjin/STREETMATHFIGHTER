<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>스트릿매쓰파이터</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="home-wrap">
    <div class="home-hero">
      <div class="siren">🚨</div>
      <p class="brand-en">STREET MATH FIGHTER</p>
      <h1>스트릿매쓰파이터</h1>
      <p>난이도를 선택하고 문제를 풀어보세요</p>
    </div>
    <div class="home-spacer"></div>
    <div class="difficulty-grid">
      <button class="difficulty-card 하" data-difficulty="하">
        <span class="difficulty-label">하</span>
        <small>쉬움</small>
      </button>
      <button class="difficulty-card 중" data-difficulty="중">
        <span class="difficulty-label">중</span>
        <small>보통</small>
      </button>
      <button class="difficulty-card 상" data-difficulty="상">
        <span class="difficulty-label">상</span>
        <small>어려움</small>
      </button>
    </div>
  </div>

  <script src="js/queue.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
