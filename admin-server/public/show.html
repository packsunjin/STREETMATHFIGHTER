<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Modernist — design-system tokens and component classes. This file is the source of truth for the system's look; retune it here and see readme.md. */
/* 같은 Archivo를 직접 들고 있는 파일에서 부른다. 행사 당일 학교 네트워크가
   구글 폰트를 막거나 느리면 무대 화면 글자가 통째로 튄다. 글꼴은 그대로다. */
@import url('/vendor/fonts.css');

:root {
  --color-bg: #f3f2f2;
  --color-surface: #eae9e9;
  --color-text: #201e1d;
  --color-accent: #ec3013;
  --color-accent-2: #e15b47;
  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);

  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the
     same step of any role matches the others in visual value. */
  --color-neutral-100: #f8f4f4;
  --color-neutral-200: #eae7e7;
  --color-neutral-300: #d7d3d3;
  --color-neutral-400: #bab6b6;
  --color-neutral-500: #9b9797;
  --color-neutral-600: #7d7979;
  --color-neutral-700: #605d5d;
  --color-neutral-800: #444141;
  --color-neutral-900: #2d2b2b;

  --color-accent-100: #fff2ef;
  --color-accent-200: #ffe0d9;
  --color-accent-300: #ffc4b8;
  --color-accent-400: #ff9783;
  --color-accent-500: #ff563c;
  --color-accent-600: #dd2b0f;
  --color-accent-700: #ae1800;
  --color-accent-800: #7c1405;
  --color-accent-900: #4d170e;

  --color-accent-2-100: #fff2ef;
  --color-accent-2-200: #ffe0da;
  --color-accent-2-300: #ffc4b9;
  --color-accent-2-400: #ff9784;
  --color-accent-2-500: #ef6853;
  --color-accent-2-600: #c94b39;
  --color-accent-2-700: #9e3526;
  --color-accent-2-800: #71261b;
  --color-accent-2-900: #471d16;

  --font-heading: "Archivo", system-ui, sans-serif;
  --font-heading-weight: 800;
  --font-body: "Archivo", system-ui, sans-serif;

  --space-1: 4.0px;
  --space-2: 8.0px;
  --space-3: 12.0px;
  --space-4: 16.0px;
  --space-6: 24.0px;
  --space-8: 32.0px;

  --radius-sm: 0px;
  --radius-md: 0px;
  --radius-lg: 0px;

  /* Elevation — derived from the ground: soft ink-tinted shadows on a
     light theme, a hairline edge + ambient darkness on a dark one. */
  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);
  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);
}

body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
}
h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }

.grayscale{filter:grayscale(1) contrast(1.08)}

/* ══════════════════════════════════════════════════════════════════════════
   Components — built with the tokens above. Plain CSS
   on plain HTML: no JavaScript, no build step. Each class is documented in
   readme.md and demonstrated in foundations/ and components/.
   ══════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
}
h1 { font-size: 42px; }
h2 { font-size: 32px; }
h3 { font-size: 25px; }
h4 { font-size: 20px; }
h5 { font-size: 16px; }
h6 { font-size: 13px; }
h6 { letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-accent); text-underline-offset: 3px; }
img { display: block; max-width: 100%; }
figure { margin: 0; }
figcaption {
  font-size: 11px; margin-top: var(--space-1);
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

/* — rules — */
.hr {
  height: 2px; border: 0; margin: var(--space-4) 0;
  background: var(--color-divider);
}

/* — buttons — */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —
     the pair sits side by side in sign-up rows */
  background: transparent; border: 1px solid transparent;
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: var(--radius-md);
}
.btn svg { display: block; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: var(--color-bg); }
.btn-primary:hover { background: var(--color-accent-600); }
.btn-primary:active { background: var(--color-accent-700); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }
.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }
.btn-icon { width: 36px; height: 36px; padding: 0; }
.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }

/* — forms — */
.field > label {
  display: block; font-size: 12px; margin-bottom: 5px;
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
}
.input {
  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
textarea.input { min-height: 90px; resize: vertical; }
.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.radio input, .seg-opt input {
  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
}
.radio .dot {
  width: 16px; height: 16px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--color-divider);
}
.radio:hover .dot { border-color: var(--color-accent); }
.radio input:checked + .dot {
  border-color: var(--color-accent); background: var(--color-accent);
  box-shadow: inset 0 0 0 4px var(--color-bg);
}
.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.seg {
  display: inline-flex; overflow: hidden;
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.seg-opt {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; font-size: 13px; cursor: pointer;
}
.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }
.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }

/* — cards — */
.card {
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);
}
.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
.card-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 17px; line-height: 1.2;
}
.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }
.card-meta {
  display: flex; align-items: center; gap: 6px; font-size: 11px;
  color: color-mix(in srgb, var(--color-text) 50%, transparent);
}
.elev-sm { box-shadow: var(--shadow-sm); }
.elev-md { box-shadow: var(--shadow-md); }
.elev-lg { box-shadow: var(--shadow-lg); }

/* — tags — */
.tag {
  display: inline-flex; align-items: center; font-size: 11px;
  letter-spacing: 0.02em; padding: 3px 10px;
  border-radius: calc(var(--radius-md) * 0.75);
}
.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }
.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }
.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }

/* — navigation — */
.nav {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-bottom: 2px solid var(--color-divider);
}
.nav-brand {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 18px; margin-right: auto;
}
.nav a { color: inherit; text-decoration: none; font-size: 14px; }
.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }

/* — tables — */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th {
  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 60%, transparent);
  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);
}
.table td {
  padding: var(--space-2);
  border-bottom: 1px solid var(--color-divider);
}
.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }

/* — dialog — */
.dialog-backdrop {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: var(--space-4);
  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);
}
.dialog {
  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);
  padding: var(--space-4); border-radius: var(--radius-lg);
  background: var(--color-surface); box-shadow: var(--shadow-lg);
}
.dialog-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 20px;
}
.dialog-body { font-size: 14px; opacity: 0.85; }
.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }


</style>

  </div>

  <section class="screen active" id="idle" style="flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px)">
    <div style="padding:40px;border-right:2px solid var(--color-divider);display:flex;flex-direction:column;gap:clamp(12px,2.4vh,20px);align-items:center;justify-content:center;text-align:center">
      <div style="font-size:12px;letter-spacing:0.18em;text-transform:uppercase">Street Math Fighter</div>
      <div style="font-family:var(--font-heading);font-size:clamp(38px,8vh,72px);font-weight:800;line-height:0.92;letter-spacing:-0.03em;text-transform:uppercase">대기</div>
      <button id="startBtn" style="border:2px solid var(--color-text);background:var(--color-accent);color:#fff;padding:clamp(12px,2.4vh,18px) 24px;font-size:clamp(15px,2.6vh,19px);font-weight:700;cursor:pointer">시작 Enter</button>
    </div>
    <div style="padding:24px;display:flex;flex-direction:column;gap:10px">

  </section>

  <section class="screen" id="confirm" style="flex:1;min-height:0;overflow:auto;padding:clamp(20px,4vh,40px);display:flex;flex-direction:column;gap:clamp(12px,2.4vh,20px);align-items:center;justify-content:center;text-align:center">

        <div id="shortPanel" style="flex:1 1 0;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden"><div id="answerDisplay" style="flex:0 0 auto;border:2px solid var(--color-text);padding:10px 12px;min-height:clamp(48px,7vh,64px);display:flex;align-items:center;justify-content:flex-end;font-family:var(--font-heading);font-size:clamp(24px,4.2vh,38px);font-weight:800;letter-spacing:-0.02em;overflow:hidden;white-space:nowrap"></div><div id="keypad" style="flex:1 1 0;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:6px"></div></div>
        <div id="choicePanel" style="flex:1 1 0;padding:10px;display:none;grid-auto-rows:minmax(0,1fr);gap:8px;min-height:0;overflow:hidden"></div>
        <div id="answerFooter" style="margin-top:auto;padding:12px;border-top:2px solid var(--color-divider);display:flex;flex-direction:column;gap:8px"><button id="submitBtn" style="width:100%;border:2px solid var(--color-text);background:var(--color-accent);color:#fff;padding:16px;font-size:16px;font-weight:700;text-align:left;cursor:pointer">제출 Enter</button><button id="closeAnswer" style="width:100%;border:2px solid var(--color-divider);background:transparent;padding:10px;font-size:13px;text-align:left;cursor:pointer">닫기 A</button></div>
      </div>
    </div>
  </section>

  <section class="screen" id="grading" style="flex:1;min-height:0;padding:clamp(20px,4vh,40px);display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center"><div id="gradingMode" style="font-size:12px;letter-spacing:0.18em;text-transform:uppercase">주관식</div><div style="font-family:var(--font-heading);font-size:clamp(34px,7vh,64px);font-weight:800;text-transform:uppercase;line-height:0.95;letter-spacing:-0.03em">채점 중</div><div style="width:100%;max-width:560px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:2px solid var(--color-divider)"><div style="padding:clamp(10px,2vh,16px);border-right:2px solid var(--color-divider);display:flex;flex-direction:column;gap:4px"><div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase">제출 답</div><div id="gradingAnswer" style="font-family:var(--font-heading);font-size:clamp(22px,4vh,34px);font-weight:800">—</div></div><div style="padding:clamp(10px,2vh,16px);display:flex;flex-direction:column;gap:4px"><div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase">소요 시간</div><div id="gradingElapsed" style="font-family:var(--font-heading);font-size:clamp(22px,4vh,34px);font-weight:800">0:00</div></div></div><div style="height:12px;border:2px solid var(--color-divider);width:100%;max-width:560px;overflow:hidden"><div id="gradeBar" style="height:100%;background:var(--color-accent);width:0%"></div></div><div id="gradeStep" style="font-size:12px;letter-spacing:0.1em">답안 확인</div></section>

  <section class="screen" id="result" style="flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column"><div id="verdict" style="padding:18px 24px;font-family:var(--font-heading);font-size:clamp(30px,6vh,54px);font-weight:800;background:var(--color-accent);color:#fff">정답</div><div style="flex:1;min-height:0;padding:clamp(18px,3.5vh,32px) clamp(20px,4vw,40px);display:flex;flex-direction:column;gap:clamp(10px,2vh,16px);align-items:center;justify-content:center;text-align:center"><div style="width:100%;max-width:760px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:2px solid var(--color-divider);text-align:left"><div style="padding:clamp(10px,2vh,16px);border-right:2px solid var(--color-divider);display:flex;flex-direction:column;gap:4px"><div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase">제출 답</div><div id="resultTyped" style="font-family:var(--font-heading);font-size:clamp(22px,4vh,32px);font-weight:800">—</div></div><div style="padding:clamp(10px,2vh,16px);border-right:2px solid var(--color-divider);display:flex;flex-direction:column;gap:4px"><div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase">정답</div><div id="resultCorrect" style="font-family:var(--font-heading);font-size:clamp(22px,4vh,32px);font-weight:800;color:var(--color-accent-700)">—</div></div><div style="padding:clamp(10px,2vh,16px);display:flex;flex-direction:column;gap:4px"><div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase">소요 시간</div><div id="resultElapsed" style="font-family:var(--font-heading);font-size:clamp(22px,4vh,32px);font-weight:800">0:00</div></div></div><div id="prizeLabel" style="font-family:var(--font-heading);font-size:clamp(20px,3.6vh,30px);font-weight:800;letter-spacing:-0.02em">상품 지급</div><div id="prizeNote" style="font-size:13px">정답 — 상품을 받아가세요</div><div style="display:flex;gap:12px;flex-wrap:wrap"><button id="nextBtn" style="border:2px solid var(--color-text);background:var(--color-accent);color:#fff;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer">다음 사람 Enter</button><button id="idleBtn" style="border:2px solid var(--color-divider);background:transparent;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer">처음으로 Esc</button></div></div></section>
</div>
<script>
(() => {
  const $=id=>document.getElementById(id);
  const LEVELS=[{key:'1',id:'easy',name:'하',time:90,notes:['기본 계산 중심','여유 있는 풀이 시간']},{key:'2',id:'mid',name:'중',time:180,notes:['응용 한 단계 포함','표준 시험 속도']},{key:'3',id:'hard',name:'상',time:300,notes:['다단계 추론 문항','실전 최고 난도']}];
  const LABELS={idle:'대기',difficulty:'난이도 선택',confirm:'제한시간 확인',countdown:'카운트다운',solve:'문제 풀이',grading:'채점',result:'결과'};
  const screens=['idle','difficulty','confirm','countdown','solve','grading','result'];
  const state={problems:[],level:'mid',index:0,question:null,used:new Set(),answer:'',picked:null,remain:0,elapsed:0,grade:0,muted:false,pen:true,width:6,zoom:100,strokes:[],redo:[],timer:null,cd:null};
  const norm=d=>({하:'easy',중:'mid',상:'hard',easy:'easy',mid:'mid',hard:'hard'}[String(d||'').toLowerCase()]||d);
  function show(s){screens.forEach(x=>$(x).classList.toggle('active',x===s)); $('screenLabel').textContent=LABELS[s]; if(s==='solve') requestAnimationFrame(initCanvas);}
  // ---- 소리 (시안 그대로)
  function beep(freq,dur,type){if(state.muted)return;try{const A=window.AudioContext||window.webkitAudioContext;const a=state.ac||(state.ac=new A());if(a.state==='suspended')a.resume();const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.value=freq;g.gain.setValueAtTime(.06,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur)}catch(e){}}
  async function loadProblems(){
    try{
      const r=await fetch('api/show/problems',{credentials:'include'}); if(!r.ok) throw new Error(r.status);
      const d=await r.json(); const rows=Array.isArray(d.problems)?d.problems:[];
      state.problems=rows.filter(p=>p&&p.imageUrl&&p.answer!==null&&p.answer!==undefined).map(p=>{const type=p.questionType==='objective'?'choice':'short';const ans=String(p.answer);const ai=Number(ans);return {id:p.id,image:p.imageUrl,type,answer:ans,choices:type==='choice'?['1','2','3','4','5']:[],correctIndex:Number.isInteger(ai)&&ai>=1&&ai<=5?ai-1:0,difficulty:norm(p.difficulty),unit:p.unit||'',title:p.title||''}});
    }catch(e){console.warn('실시간 문제 연동 실패',e);state.problems=[];}
    renderStatus();
  }
  function pool(level){return state.problems.filter((p,i)=>p.difficulty===level&&!state.used.has(p.id));}
  function pick(level){let p=pool(level);if(!p.length){state.problems.filter(q=>q.difficulty===level).forEach(q=>state.used.delete(q.id));p=pool(level)}if(!p.length)return null;return p[Math.floor(Math.random()*p.length)];}
  function renderStatus(){const box=$('keyHelp');box.innerHTML='';LEVELS.forEach(l=>{const n=state.problems.filter(p=>p.difficulty===l.id).length;const left=pool(l.id).length;const d=document.createElement('div');d.textContent=`${l.name} (${l.key}) · ${n?`${left||'한 바퀴'}개`:'등록된 문제 없음'}`;box.appendChild(d)});}
  function renderLevels(){const wrap=$('levels');wrap.innerHTML='';LEVELS.forEach(l=>{const b=document.createElement('button');b.style.cssText='border:0;border-right:2px solid var(--color-text);background:var(--color-bg);color:var(--color-text);padding:clamp(18px,3vh,28px);display:flex;flex-direction:column;gap:12px;text-align:left;cursor:pointer;min-width:0';if(l.id==='hard')b.style.borderRight='0';b.innerHTML=`<div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px"><div style="font-size:12px;letter-spacing:.12em;text-transform:uppercase">Level ${l.key}</div><div style="font-size:12px;border:2px solid currentColor;padding:2px 8px;letter-spacing:.08em">${l.key}</div></div><div style="font-family:var(--font-heading);font-size:clamp(34px,8vh,64px);font-weight:800;line-height:.95;letter-spacing:-.03em">${l.name}</div><div style="display:flex;align-items:baseline;gap:8px"><div style="font-family:var(--font-heading);font-size:clamp(20px,3.4vh,28px);font-weight:800">${fmt(l.time)}</div><div style="font-size:12px;letter-spacing:.08em">제한시간</div></div><div style="margin-top:auto;display:flex;flex-direction:column;gap:5px"><div style="font-size:12px;line-height:1.45">${l.notes[0]}</div><div style="font-size:12px;line-height:1.45">${l.notes[1]}</div></div>`;b.onclick=()=>chooseLevel(l.id);wrap.appendChild(b)})}
  function chooseLevel(level){beep(880,.06);state.level=level;state.question=pick(level);state.index=0;if(!state.question){alert('이 난이도에는 등록된 문제가 없습니다.');return} $('limitLabel').textContent=fmt(levelObj().time);$('levelName').textContent='난이도 '+levelObj().name;$('confirmStats').innerHTML=`<div style="padding:16px;border-right:2px solid var(--color-divider)"><div style="font-size:11px;letter-spacing:.1em">유형</div><div style="font-family:var(--font-heading);font-size:26px;font-weight:800">${state.question.type==='choice'?'객관식':'주관식'}</div></div><div style="padding:16px;border-right:2px solid var(--color-divider)"><div style="font-size:11px;letter-spacing:.1em">단원</div><div style="font-family:var(--font-heading);font-size:20px;font-weight:800">${state.question.unit||'—'}</div></div><div style="padding:16px"><div style="font-size:11px;letter-spacing:.1em">남은 문제</div><div style="font-family:var(--font-heading);font-size:26px;font-weight:800">${pool(level).length}개</div></div>`;$('levelNotes').innerHTML=levelObj().notes.map(n=>`<div style="font-size:13px;line-height:1.5">${n}</div>`).join('');show('confirm')}
  const levelObj=()=>LEVELS.find(x=>x.id===state.level);
  const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  function startCountdown(){show('countdown');let n=3;$('countdownNum').textContent=n;beep(660,.12);clearInterval(state.cd);state.cd=setInterval(()=>{n--;if(n<=0){clearInterval(state.cd);beep(990,.2);showSolve()}else{$('countdownNum').textContent=n;beep(660,.12)}},900)}
  function showSolve(){if(!state.question) return;show('solve');state.answer='';state.picked=null;state.remain=levelObj().time;state.elapsed=0;state.strokes=[];state.redo=[];state.zoom=100;$('answerPanel').style.display='none';$('answerOpenWrap').style.display='block';makeChoices();renderAnswer();updateSolveUI();loadQuestionImage();initCanvas();startTimer();beep(523,.1,'square');setTimeout(()=>beep(784,.16,'square'),110)}
  function startTimer(){clearInterval(state.timer);state.timer=setInterval(()=>{state.remain--;state.elapsed++;updateSolveUI();if(state.remain<=10&&state.remain>0)beep(1180,.09,'square');else if(state.remain>10)beep(state.remain%2===0?700:620,.035,'square');if(state.remain<=0){clearInterval(state.timer);beep(300,.5,'sawtooth');setTimeout(()=>beep(200,.6,'sawtooth'),260);submit(true)}},1000)}
  function updateSolveUI(){$('clock').textContent=state.remain<=0?'0:00':fmt(state.remain);$('gauge').style.width=Math.max(0,state.remain/levelObj().time*100)+'%';$('modeLabel').textContent=state.question.type==='choice'?'객관식':'주관식';$('unitName').textContent=state.question.unit||'';$('scoreLabel').textContent='정답 '+Math.floor((state.score||0)/10)}
  function loadQuestionImage(){const q=state.question;$('questionImg').style.backgroundImage=`url(${JSON.stringify(q.image)})`;applyZoom()}
  function applyZoom(){$('questionImg').style.backgroundSize=(state.zoom/100*100)+'% auto';$('zoomLabel').textContent=state.zoom+'%'}
  function renderAnswer(){ $('answerDisplay').textContent=state.answer||''; document.querySelectorAll('.choice-btn').forEach(b=>b.style.background=b.dataset.i==state.picked?'var(--color-accent)':'transparent');$('shortPanel').style.display=state.question&&state.question.type==='short'?'flex':'none';$('choicePanel').style.display=state.question&&state.question.type==='choice'?'grid':'none';$('panelMode').textContent=state.question&&state.question.type==='choice'?'객관식':'주관식';}
  function makeKeypad(){const keys=['7','8','9','4','5','6','1','2','3','0','.','/','-','⌫','C'];const box=$('keypad');box.innerHTML='';keys.forEach(k=>{const b=document.createElement('button');b.textContent=k;b.style.cssText='border:2px solid var(--color-divider);background:transparent;padding:0;font-size:clamp(14px,2.2vh,19px);font-weight:700;cursor:pointer;min-height:0';b.onclick=()=>{if(k==='C')state.answer='';else if(k==='⌫')state.answer=state.answer.slice(0,-1);else{beep(1200,.03);state.answer+=k}renderAnswer()};box.appendChild(b)})}
  function makeChoices(){const box=$('choicePanel');box.innerHTML='';(state.question?.choices||[]).forEach((c,i)=>{const b=document.createElement('button');b.className='choice-btn';b.dataset.i=i;b.textContent=c;b.style.cssText='border:2px solid var(--color-divider);background:transparent;padding:0;font-size:clamp(18px,3vh,28px);font-weight:700;cursor:pointer';b.onclick=()=>{state.picked=i;renderAnswer()};box.appendChild(b)})}
  function submit(timeout=false){clearInterval(state.timer);state.answer=state.answer.trim();const q=state.question;const ok=!timeout&&(q.type==='choice'?state.picked===q.correctIndex:state.answer===String(q.answer).trim());state.correct=ok;state.score=(state.score||0)+(ok?10:0);$('gradingMode').textContent=q.type==='choice'?'객관식':'주관식';$('gradingAnswer').textContent=state.answer||(state.picked!=null?String(state.picked+1):'—');$('gradingElapsed').textContent=fmt(state.elapsed);$('gradeBar').style.width='0%';$('gradeStep').textContent='답안 확인';show('grading');let p=0;clearInterval(state.gradeTimer);state.gradeTimer=setInterval(()=>{p+=20;$('gradeBar').style.width=p+'%';$('gradeStep').textContent=p<60?'계산 중':p<100?'판정 중':'완료';if(p>=100){clearInterval(state.gradeTimer);beep(ok?1046:220,ok?.25:.35,ok?'triangle':'sawtooth');showResult(ok,timeout)}},120)}
  function showResult(ok,timeout){const q=state.question;show('result');$('resultTyped').textContent=state.answer||(state.picked!=null?String(state.picked+1):'—');$('resultCorrect').textContent=q.type==='choice'?String(q.correctIndex+1):q.answer;$('resultElapsed').textContent=fmt(state.elapsed);$('verdict').textContent=timeout?'시간 종료':ok?'정답':'오답';$('verdict').style.background=ok?'var(--color-accent)':'var(--color-text)';$('prizeLabel').textContent=ok?'상품 지급':'다음 사람';$('prizeNote').textContent=ok?'정답 — 상품을 받아가세요':timeout?'시간 종료 — 정답을 확인하세요':'오답 — 같은 문제를 다시 풉니다';$('nextBtn').textContent=ok?'다음 문제':'다음 사람'}
  function next(){if(state.correct){state.used.add(state.question.id);state.question=pick(state.level);if(!state.question){chooseLevel(state.level);return}}showSolve()}
  function toIdle(){clearInterval(state.timer);show('idle');renderStatus()}
  function initCanvas(){const c=$('canvas'),w=$('boardWrap');const rect=w.getBoundingClientRect();if(!rect.width||!rect.height)return;const dpr=devicePixelRatio||1;c.width=rect.width*dpr;c.height=rect.height*dpr;c.getContext('2d').setTransform(dpr,0,0,dpr,0,0);drawAll()}
  function pos(e){const r=$('canvas').getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
  let drawing=false,last=null;
  $('canvas').addEventListener('pointerdown',e=>{beep(1200,.03);drawing=true;last=pos(e);$('canvas').setPointerCapture(e.pointerId);state.redo=[]});
  $('canvas').addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);state.strokes.push({x1:last.x,y1:last.y,x2:p.x,y2:p.y,erase:!state.pen,w:state.width,zoom:state.zoom});last=p;drawAll()});
  ['pointerup','pointercancel'].forEach(ev=>$('canvas').addEventListener(ev,()=>{drawing=false;last=null}));
  function drawAll(){const c=$('canvas'),ctx=c.getContext('2d'),r=c.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.lineCap='round';state.strokes.forEach(s=>{ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';ctx.strokeStyle='var(--color-text)';ctx.lineWidth=s.w;ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke()});ctx.globalCompositeOperation='source-over'}
  $('penBtn').onclick=()=>{state.pen=true};$('eraserBtn').onclick=()=>{state.pen=false};$('widthInput').oninput=e=>{state.width=+e.target.value;$('widthLabel').textContent=state.width+'px'};
  $('undoBtn').onclick=()=>{if(state.strokes.length)state.redo.push(state.strokes.pop());drawAll()};$('redoBtn').onclick=()=>{if(state.redo.length)state.strokes.push(state.redo.pop());drawAll()};$('clearBtn').onclick=()=>{state.strokes=[];state.redo=[];drawAll()};
  $('zoomIn').onclick=()=>{state.zoom=Math.min(240,state.zoom+10);applyZoom()};$('zoomOut').onclick=()=>{state.zoom=Math.max(60,state.zoom-10);applyZoom()};$('zoomReset').onclick=()=>{state.zoom=100;applyZoom()};
  $('openAnswer').onclick=()=>{$('answerPanel').style.display='flex';$('answerOpenWrap').style.display='none';renderAnswer()};$('closeAnswer').onclick=()=>{$('answerPanel').style.display='none';$('answerOpenWrap').style.display='block'};$('submitBtn').onclick=()=>submit(false);
  $('startBtn').onclick=()=>{renderLevels();show('difficulty')};$('diffBack').onclick=()=>show('idle');$('confirmGo').onclick=startCountdown;$('confirmBack').onclick=()=>show('difficulty');$('nextBtn').onclick=next;$('idleBtn').onclick=toIdle;$('muteBtn').onclick=()=>{state.muted=!state.muted;$('muteBtn').textContent=state.muted?'소리 꺼짐':'소리 켜짐'};$('fullBtn').onclick=()=>{document.documentElement.requestFullscreen?.()};
  document.addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F')$('fullBtn').click();else if(e.key==='Escape')toIdle();else if(e.key==='Enter'&&['idle','confirm','result'].some(s=>$(s).classList.contains('active'))){if($("idle").classList.contains('active'))$('startBtn').click();else if($("confirm").classList.contains('active'))$('confirmGo').click();else $('nextBtn').click()}else if($("difficulty").classList.contains('active')&&['1','2','3'].includes(e.key))chooseLevel(LEVELS[+e.key-1].id);else if($("solve").classList.contains('active')){if(e.key.toLowerCase()==='a')$('openAnswer').click();if(e.key.toLowerCase()==='e')state.pen=false;if(e.key.toLowerCase()==='u')$('undoBtn').click();if(e.key.toLowerCase()==='r')$('redoBtn').click();if(e.key.toLowerCase()==='c')$('clearBtn').click()}});
  window.addEventListener('resize',()=>{if($("solve").classList.contains('active'))initCanvas()});
  makeKeypad();
  show('idle');
  loadProblems();
})();
</script>
</body>
</html>
