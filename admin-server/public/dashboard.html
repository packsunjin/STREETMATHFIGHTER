<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>문제 관리 - 스트릿매쓰파이터</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="admin-page">
  <div class="top-bar">
    <h1>스트릿매쓰파이터 · 문제 관리</h1>
    <div>
      <span id="whoami" style="margin-right: 12px; font-size: 13px;"></span>
      <button id="logoutBtn">로그아웃</button>
    </div>
  </div>

  <div class="dashboard">
    <div class="panel">
      <h2>문제 목록</h2>
      <div class="filter-tabs">
        <button class="tab-btn active" data-difficulty="">전체</button>
        <button class="tab-btn" data-difficulty="하">하</button>
        <button class="tab-btn" data-difficulty="중">중</button>
        <button class="tab-btn" data-difficulty="상">상</button>
      </div>
      <ul class="problem-list" id="problemList"></ul>
      <div class="empty-state" id="emptyState" style="display:none;">등록된 문제가 없습니다.</div>
    </div>

    <div class="panel">
      <h2 id="formTitle">새 문제 등록</h2>
      <form id="problemForm">
        <input type="hidden" id="problemId" />
        <div class="field">
          <label for="title">문제 제목</label>
          <input type="text" id="title" name="title" placeholder="예: 이차방정식 활용 - 1" required />
        </div>
        <div class="field">
          <label for="difficulty">난이도</label>
          <select id="difficulty" name="difficulty" required>
            <option value="하">하</option>
            <option value="중">중</option>
            <option value="상">상</option>
          </select>
        </div>
        <div class="field">
          <label for="unit">단원 (선택)</label>
          <input type="text" id="unit" name="unit" list="unitOptions" placeholder="예: 등비수열" />
          <datalist id="unitOptions"></datalist>
        </div>
        <div class="field">
          <label>문제 유형</label>
          <div class="segmented" id="questionTypeGroup">
            <label class="segmented-option">
              <input type="radio" name="questionType" value="subjective" checked />
              <span>주관식</span>
            </label>
            <label class="segmented-option">
              <input type="radio" name="questionType" value="objective" />
              <span>객관식</span>
            </label>
          </div>
        </div>
        <div class="field" id="answerFieldObjective">
          <label>정답 (객관식)</label>
          <div class="choice-picker" id="answerChoiceGroup">
            <label class="choice-option"><input type="radio" name="answerChoice" value="1" /><span>①</span></label>
            <label class="choice-option"><input type="radio" name="answerChoice" value="2" /><span>②</span></label>
            <label class="choice-option"><input type="radio" name="answerChoice" value="3" /><span>③</span></label>
            <label class="choice-option"><input type="radio" name="answerChoice" value="4" /><span>④</span></label>
            <label class="choice-option"><input type="radio" name="answerChoice" value="5" /><span>⑤</span></label>
          </div>
        </div>
        <div class="field" id="answerFieldSubjective">
          <label for="answerText">정답 (선택, 자동 채점용)</label>
          <input type="text" id="answerText" name="answerText" placeholder="비워두면 채점 없이 풀이만 가능합니다." />
        </div>
        <div class="field">
          <label for="image">문제 이미지</label>
          <input type="file" id="image" name="image" accept="image/*" />
          <img id="imagePreview" class="image-preview" alt="미리보기" />
        </div>
        <div class="field">
          <label for="description">설명 / 해설 (선택)</label>
          <textarea id="description" name="description" placeholder="학생에게 보여줄 설명이나 정답 해설을 입력하세요."></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="submitBtn">등록하기</button>
          <button type="button" class="btn-secondary" id="resetBtn">새로 작성</button>
        </div>
      </form>
    </div>
  </div>

  </div>

  <div class="toast" id="toast"></div>

  <script src="js/dashboard.js"></script>
</body>
</html>
