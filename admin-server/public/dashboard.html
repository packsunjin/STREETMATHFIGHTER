<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>문제 관리 - 스트릿매쓰파이터</title>
<link rel="stylesheet" href="vendor/fonts.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="admin-page">

  <!-- 진행 화면과 같은 띠. 두 화면을 오가도 같은 앱으로 보인다. -->
  <div class="topbar">
    <div class="topbar-brand">Street Math Fighter</div>
    <div class="topbar-screen">문제 관리</div>
    <div class="topbar-who" id="whoami"></div>
    <div class="topbar-right">
      <!-- 행사 당일 전자칠판에서 여는 화면. 가장 중요한 진입점이라 눈에 띄게 둔다. -->
      <a href="show.html" class="btn btn-show">행사 진행</a>
      <a href="stats/" class="btn">통계</a>
      <button class="btn" id="logoutBtn">로그아웃</button>
    </div>
  </div>

  <div class="workspace">

    <section class="col col-list">
      <div class="col-head">
        <h2 class="headline">문제 목록</h2>
        <div class="eyebrow muted" id="listCount">0 문제</div>
      </div>

      <!-- 난이도 칸이 곧 거르개다. 숫자는 DB에 실제로 들어 있는 문제 수. -->
      <div class="cells">
        <button class="tab-btn active" data-difficulty="">
          <span class="tab-label">전체</span>
          <span class="tab-count" data-count="">0</span>
        </button>
        <button class="tab-btn" data-difficulty="하">
          <span class="tab-label">난이도 하</span>
          <span class="tab-count" data-count="하">0</span>
        </button>
        <button class="tab-btn" data-difficulty="중">
          <span class="tab-label">난이도 중</span>
          <span class="tab-count" data-count="중">0</span>
        </button>
        <button class="tab-btn" data-difficulty="상">
          <span class="tab-label">난이도 상</span>
          <span class="tab-count" data-count="상">0</span>
        </button>
      </div>

      <div class="col-body">
        <ul class="problem-list" id="problemList"></ul>
        <div class="empty-state" id="emptyState" hidden>등록된 문제가 없습니다. 오른쪽에서 첫 문제를 등록하세요.</div>
      </div>
    </section>

    <section class="col col-form">
      <div class="col-head">
        <h2 class="headline" id="formTitle">새 문제 등록</h2>
        <div class="eyebrow muted" id="formHint">비어 있는 폼</div>
      </div>

      <div class="col-body">
      <form id="problemForm" class="problem-form">
        <input type="hidden" id="problemId" />
        <div class="field">
          <label for="title">문제 제목</label>
          <input type="text" id="title" name="title" placeholder="예: 이차방정식 활용 - 1" maxlength="200" required />
        </div>
        <div class="field">
          <label for="difficulty">난이도</label>
          <select id="difficulty" name="difficulty" required>
            <option value="하">하 · 1:30</option>
            <option value="중">중 · 3:00</option>
            <option value="상">상 · 5:00</option>
          </select>
        </div>
        <div class="field">
          <label for="unit">단원 (선택)</label>
          <input type="text" id="unit" name="unit" list="unitOptions" placeholder="예: 등비수열" maxlength="100" />
          <datalist id="unitOptions"></datalist>
        </div>
        <div class="field">
          <span class="field-label">문제 유형</span>
          <div class="segmented" id="questionTypeGroup">
            <label class="segmented-option">
              <input type="radio" name="questionType" value="subjective" checked />
              <span>주관식</span>
            </label>
            <label class="segmented-option">
              <input type="radio" name="questionType" value="objective" />
              <span>객관식</span>
            </label>
          </div>
        </div>
        <div class="field" id="answerFieldObjective">
          <span class="field-label">정답 (객관식)</span>
          <div class="choice-picker" id="answerChoiceGroup">
            <label class="choice-option"><input type="radio" name="answerChoice" value="1" /><span>①</span></label>
            <label class="choice-option"><input type="radio" name="answerChoice" value="2" /><span>②</span></label>
            <label class="choice-option"><input type="radio" name="answerChoice" value="3" /><span>③</span></label>
            <label class="choice-option"><input type="radio" name="answerChoice" value="4" /><span>④</span></label>
            <label class="choice-option"><input type="radio" name="answerChoice" value="5" /><span>⑤</span></label>
          </div>
        </div>
        <div class="field" id="answerFieldSubjective">
          <!-- 진행 화면은 정답으로 그 자리에서 채점한다. 정답이 없으면 그 문제는
               진행 화면에서 아예 안 뜬다. 그래서 필수다. -->
          <label for="answerText">정답 (필수)</label>
          <input type="text" id="answerText" name="answerText" placeholder="예: 42" maxlength="500" />
          <p class="field-note">정답이 없으면 진행 화면에 그 문제가 뜨지 않습니다.</p>
        </div>
        <div class="field">
          <label for="image">문제 이미지</label>
          <!-- 문제집을 찍거나 캡처해서 올리는 게 대부분이라, 파일 선택 말고
               붙여넣기(Ctrl+V)와 드래그앤드롭도 받는다 -->
          <div class="dropzone" id="dropzone" tabindex="0" role="button"
               aria-label="이미지 선택 (클릭, 드래그앤드롭, Ctrl+V)">
            <input type="file" id="image" name="image" accept="image/*" hidden />
            <img id="imagePreview" class="image-preview" alt="미리보기" />
            <div class="dropzone-hint" id="dropzoneHint">
              <strong>클릭해서 사진 선택</strong>
              <span>또는 여기로 끌어다 놓기 · <kbd>Ctrl</kbd>+<kbd>V</kbd>로 캡처 붙여넣기</span>
            </div>
            <p class="dropzone-file" id="dropzoneFile" hidden></p>
          </div>
        </div>
        <div class="field">
          <label for="description">설명 / 해설 (선택)</label>
          <textarea id="description" name="description" placeholder="학생에게 보여줄 설명이나 정답 해설을 입력하세요." maxlength="5000"></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">등록하기</button>
          <button type="button" class="btn" id="resetBtn">새로 작성</button>
        </div>
      </form>
      </div>
    </section>

  </div>

  </div>

  <div class="toast" id="toast"></div>

  <script src="js/dashboard.js"></script>
</body>
</html>
